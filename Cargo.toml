[package]
name = "ullage-win"
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["dualface <dualface@gmail.com>"]
rust-version = "1.85"
publish = false
description = "A floating Windows window that shows ullage subscription usage"

[dependencies]
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ullage-client = { git = "https://github.com/dualface/ullage-cli.git", rev = "bc4bfce79979f95785932b252d60a2fdf4792703" }
ullage-protocol = { git = "https://github.com/dualface/ullage-cli.git", rev = "bc4bfce79979f95785932b252d60a2fdf4792703" }

[target.'cfg(windows)'.dependencies]
windows-numerics = "0.3"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
